name: Simulation or interface issue
description: Report reproducible model or UI behavior
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the expected and observed behavior. For physics issues, include a public reference when possible.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduce
      description: Include release/commit, starting load, controls, event times, browser or Node version, and whether a domain warning appeared. Share only generic simulator data, never confidential plant information.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: Attach a screenshot, exported simulation state, CSV snippet, or relevant test output.
